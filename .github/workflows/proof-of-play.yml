name: proof-of-play
on:
  push: { branches: [main, master] }
  pull_request:
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Data integrity — the real dataset must be the exact frozen bytes
        run: |
          set -e
          echo "16320c9c1ec72448db59aa0a26a0b95401046bef5d02fd3aeb906448e3055e91  data/telco-churn.csv" | sha256sum -c -

      - name: Unit tests
        run: node --test

      - name: Mutation gate — churn-forge's own kernel (load.mjs) must be CLEAN
        run: node tools/witness.mjs mutate load.mjs --test node --test

      - name: Fuzz gate — the never-throw boundary (own + vendored kernels)
        run: |
          set -e
          for fn in loadChurn churnRate; do
            node tools/witness.mjs fuzz load.mjs "$fn"
          done
          for fn in splitCases predict balancedAccuracy proposeStumps forge; do
            node tools/witness.mjs fuzz vendor/pattern-forge/pattern.mjs "$fn"
          done
          for fn in predictCompound baCompound breed; do
            node tools/witness.mjs fuzz vendor/pattern-forge/breed.mjs "$fn"
          done
          for fn in fingerprint modelBody receiptFor mint verifyMint economics; do
            node tools/witness.mjs fuzz vendor/pattern-forge/mint.mjs "$fn"
          done

      - name: Re-derive the sealed facts from the REAL data and check predictions.json
        run: node ci-verify.mjs
